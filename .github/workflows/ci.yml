name: MoonIncidence verification
on: [push, pull_request]
permissions:
  contents: read
env:
  MOONBIT_INSTALL_VERSION: "0.10.22+124d61d05"
jobs:
  targets:
    name: target-${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned official MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/moon-install.sh
          bash /tmp/moon-install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify compiler version
        run: |
          set -euo pipefail
          versions="$(moon version --all)"
          printf '%s\n' "$versions"
          printf '%s\n' "$versions" | grep -Eq '^moon 0\.1\.20261119 '
          printf '%s\n' "$versions" | grep -Eq '^moonc v0\.10\.22\+124d61d05 '
          printf '%s\n' "$versions" | grep -Eq '^moonrun 0\.1\.20261119 '
      - run: moon check --target "${{ matrix.target }}" --deny-warn
      - run: moon build --target "${{ matrix.target }}" --deny-warn
      - run: moon test --target "${{ matrix.target }}" --deny-warn
      - name: Run complete examples
        run: |
          moon run examples/hierarchy --target "${{ matrix.target }}" --deny-warn
          moon run examples/histories --target "${{ matrix.target }}" --deny-warn
          moon run examples/configurations --target "${{ matrix.target }}" --deny-warn
      - if: matrix.target == 'wasm-gc'
        name: Check formatting and public interfaces
        run: |
          moon info
          moon fmt --check
          git diff --exit-code
